# Required verification builds without provider credentials; audit is advisory.
# Actions are pinned to full commit SHAs (version in the comment); Dependabot updates them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Latest Node 22 LTS: jsdom 30 needs >=22.22.2 and vitest 5 needs >=22.12.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # engines allows Node 22 and 24. This separate job checks 24; `verify` keeps its exact
  # name because branch protection requires it (docs/branch-protection.md).
  verify-node24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # Advisory only. Job-level continue-on-error still shows a red check on every PR,
  # so the step below is advisory instead and the job reports a warning when it finds something.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit (advisory)
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Report advisory findings
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning title=Dependency advisories::npm audit found high or critical advisories in production dependencies. Advisory only: see the 'Production dependency audit' step log."
          {
            echo "### Production dependency audit"
            echo
            echo "Advisories at or above high severity were found. This job is advisory and does not block merging."
            echo "Known deferred items (Next 14 upgrade, image-size) are listed in docs/adr/0030-input-hardening.md."
          } >> "$GITHUB_STEP_SUMMARY"
